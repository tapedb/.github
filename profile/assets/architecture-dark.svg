<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">TapeDB architecture: client, workspace, storage</title>
  <desc id="arch-desc">01 Client, your application: typed queries, live subscriptions, persistent outbox. Connected over HTTP / WS to 02 Workspace, a Durable Object: single writer, SQLite database, access rules; one per workspace. Connected by async flush to 03 Storage, the tape in R2: log segments, state snapshots, recovery and replay; your buckets. A small cassette mark with turning hubs sits beside the storage title.</desc>
  <style>
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
    .sans{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
    .pkt-a{animation:ping 4.8s linear infinite}
    .pkt-b{animation:flush 4.8s linear -1.2s infinite}
    @keyframes ping{0%{transform:translateX(0)}45%{transform:translateX(110px)}50%{transform:translateX(110px)}95%{transform:translateX(0)}100%{transform:translateX(0)}}
    @keyframes flush{0%{transform:translateX(0);opacity:0}4%{transform:translateX(0);opacity:1}50%{transform:translateX(110px);opacity:1}52%{transform:translateX(110px);opacity:0}100%{transform:translateX(110px);opacity:0}}
    .top{stroke-dasharray:308;animation:draw 0.9s linear both}
    .top-b{animation-delay:0.2s}
    .top-c{animation-delay:0.4s}
    @keyframes draw{from{stroke-dashoffset:308}to{stroke-dashoffset:0}}
    .lit{animation:lit 4.8s linear infinite}
    .c1a{animation-delay:4.56s}.c1b{animation-delay:4.76s}.c1c{animation-delay:4.96s}
    .c2a{animation-delay:2.16s}.c2b{animation-delay:2.36s}.c2c{animation-delay:2.56s}
    .c3a{animation-delay:1.2s}.c3b{animation-delay:1.4s}.c3c{animation-delay:1.6s}
    @keyframes lit{0%,12%{stroke:#FF6B1A}14%,100%{stroke:#3A4046}}
    .hub{animation:tp-hub 4s linear infinite}
    .hub-a{transform-origin:1196px 128px}
    .hub-b{transform-origin:1206px 128px}
    @keyframes tp-hub{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <pattern id="arch-ticks" x="360" y="172" width="40" height="8" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="0" x2="0.5" y2="8" stroke="#3A4046" stroke-width="1"/>
      <line x1="8.5" y1="4" x2="8.5" y2="8" stroke="#3A4046" stroke-width="1"/>
      <line x1="16.5" y1="4" x2="16.5" y2="8" stroke="#3A4046" stroke-width="1"/>
      <line x1="24.5" y1="4" x2="24.5" y2="8" stroke="#3A4046" stroke-width="1"/>
      <line x1="32.5" y1="4" x2="32.5" y2="8" stroke="#3A4046" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- no ground or outer frame: the three panels sit directly on the page background -->

  <!-- 01 / CLIENT -->
  <rect x="40.5" y="40.5" width="319" height="279" rx="6" fill="none" stroke="#30363D" stroke-width="1"/>
  <text x="64" y="76" class="mono" font-size="13" letter-spacing="1.3" fill="#8A9299">01 / <tspan fill="#ECEEF0">CLIENT</tspan></text>
  <line x1="41" y1="96.5" x2="359" y2="96.5" stroke="#30363D" stroke-width="1"/>
  <text x="64" y="140" class="sans" font-size="26" font-weight="600" letter-spacing="-0.5" fill="#ECEEF0">Your application</text>
  <g class="sans" font-size="17" fill="#A9B0B7">
    <text x="84" y="184">Typed queries</text>
    <text x="84" y="216">Live subscriptions</text>
    <text x="84" y="248">Persistent outbox</text>
  </g>
  <g stroke="#3A4046" stroke-width="1">
    <line class="lit c1a" x1="64" y1="178.5" x2="74" y2="178.5"/>
    <line class="lit c1b" x1="64" y1="210.5" x2="74" y2="210.5"/>
    <line class="lit c1c" x1="64" y1="242.5" x2="74" y2="242.5"/>
  </g>
  <line class="top" x1="46" y1="40.5" x2="354" y2="40.5" stroke="#3A4046" stroke-width="1"/>
  <line x1="41" y1="272.5" x2="359" y2="272.5" stroke="#30363D" stroke-width="1"/>
  <text x="64" y="301" class="mono" font-size="12" letter-spacing="1.2" fill="#8A9299">TYPESCRIPT</text>

  <!-- connector: HTTP / WS -->
  <text x="420" y="160" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.2" fill="#8A9299">HTTP / WS</text>
  <rect x="360" y="172" width="120" height="8" fill="url(#arch-ticks)"/>
  <line x1="360" y1="180.5" x2="480" y2="180.5" stroke="#3A4046" stroke-width="1"/>
  <rect class="pkt-a" x="363" y="178.5" width="4" height="4" fill="#FF6B1A"/>

  <!-- 02 / WORKSPACE -->
  <rect x="480.5" y="40.5" width="319" height="279" rx="6" fill="none" stroke="#30363D" stroke-width="1"/>
  <text x="504" y="76" class="mono" font-size="13" letter-spacing="1.3" fill="#8A9299">02 / <tspan fill="#ECEEF0">WORKSPACE</tspan></text>
  <line x1="481" y1="96.5" x2="799" y2="96.5" stroke="#30363D" stroke-width="1"/>
  <text x="504" y="140" class="sans" font-size="26" font-weight="600" letter-spacing="-0.5" fill="#ECEEF0">Durable Object</text>
  <g class="sans" font-size="17" fill="#A9B0B7">
    <text x="524" y="184">Single writer</text>
    <text x="524" y="216">SQLite database</text>
    <text x="524" y="248">Access rules</text>
  </g>
  <g stroke="#3A4046" stroke-width="1">
    <line class="lit c2a" x1="504" y1="178.5" x2="514" y2="178.5"/>
    <line class="lit c2b" x1="504" y1="210.5" x2="514" y2="210.5"/>
    <line class="lit c2c" x1="504" y1="242.5" x2="514" y2="242.5"/>
  </g>
  <line class="top top-b" x1="486" y1="40.5" x2="794" y2="40.5" stroke="#3A4046" stroke-width="1"/>
  <line x1="481" y1="272.5" x2="799" y2="272.5" stroke="#30363D" stroke-width="1"/>
  <text x="504" y="301" class="mono" font-size="12" letter-spacing="1.2" fill="#8A9299">ONE PER WORKSPACE</text>

  <!-- connector: ASYNC FLUSH -->
  <text x="860" y="160" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.2" fill="#8A9299">ASYNC FLUSH</text>
  <rect x="800" y="172" width="120" height="8" fill="url(#arch-ticks)"/>
  <line x1="800" y1="180.5" x2="920" y2="180.5" stroke="#3A4046" stroke-width="1"/>
  <rect class="pkt-b" x="803" y="178.5" width="4" height="4" fill="#FF6B1A"/>

  <!-- 03 / STORAGE -->
  <rect x="920.5" y="40.5" width="319" height="279" rx="6" fill="none" stroke="#30363D" stroke-width="1"/>
  <text x="944" y="76" class="mono" font-size="13" letter-spacing="1.3" fill="#8A9299">03 / <tspan fill="#ECEEF0">STORAGE</tspan></text>
  <line x1="921" y1="96.5" x2="1239" y2="96.5" stroke="#30363D" stroke-width="1"/>
  <text x="944" y="140" class="sans" font-size="26" font-weight="600" letter-spacing="-0.5" fill="#ECEEF0">The tape in R2</text>
  <!-- cassette mark, 32px (64-unit grid at 0.5, origin 1185,114), hubs turning -->
  <path fill="#ECEEF0" fill-rule="evenodd" d="M1190 120H1212A3 3 0 0 1 1215 123V137A3 3 0 0 1 1212 140H1190A3 3 0 0 1 1187 137V123A3 3 0 0 1 1190 120ZM1196 123H1206A5 5 0 0 1 1206 133H1196A5 5 0 0 1 1196 123Z"/>
  <g class="hub hub-a" fill="#ECEEF0">
    <circle cx="1196" cy="128" r="2.5"/>
    <rect x="1195.5" y="124.25" width="1" height="1.75"/>
    <rect x="1195.5" y="124.25" width="1" height="1.75" transform="rotate(120 1196 128)"/>
    <rect x="1195.5" y="124.25" width="1" height="1.75" transform="rotate(240 1196 128)"/>
  </g>
  <g class="hub hub-b" fill="#ECEEF0">
    <circle cx="1206" cy="128" r="2.5"/>
    <rect x="1205.5" y="124.25" width="1" height="1.75"/>
    <rect x="1205.5" y="124.25" width="1" height="1.75" transform="rotate(120 1206 128)"/>
    <rect x="1205.5" y="124.25" width="1" height="1.75" transform="rotate(240 1206 128)"/>
  </g>
  <rect x="1197" y="135.5" width="8" height="2" rx="0.5" fill="#FF6B1A"/>
  <g class="sans" font-size="17" fill="#A9B0B7">
    <text x="964" y="184">Log segments</text>
    <text x="964" y="216">State snapshots</text>
    <text x="964" y="248">Recovery &amp; replay</text>
  </g>
  <g stroke="#3A4046" stroke-width="1">
    <line class="lit c3a" x1="944" y1="178.5" x2="954" y2="178.5"/>
    <line class="lit c3b" x1="944" y1="210.5" x2="954" y2="210.5"/>
    <line class="lit c3c" x1="944" y1="242.5" x2="954" y2="242.5"/>
  </g>
  <line class="top top-c" x1="926" y1="40.5" x2="1234" y2="40.5" stroke="#3A4046" stroke-width="1"/>
  <line x1="921" y1="272.5" x2="1239" y2="272.5" stroke="#30363D" stroke-width="1"/>
  <text x="944" y="301" class="mono" font-size="12" letter-spacing="1.2" fill="#8A9299">YOUR BUCKETS</text>
</svg>
